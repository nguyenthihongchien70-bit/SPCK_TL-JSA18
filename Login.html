<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-white d-flex align-items-center justify-content-center min-vh-100">

    <div class="bg-light text-dark p-4 p-md-5 rounded-4 shadow-lg border border-secondary border-opacity-10 w-100" 
         style="max-width: 420px;"
         data-aos="zoom-in" 
         data-aos-duration="1000">
        
        <div class="text-center mb-4" data-aos="fade-down" data-aos-delay="200">
            <h2 class="fw-bold mb-2 text-primary">Đăng Nhập</h2>
            <p class="text-muted small">Chào mừng bạn quay trở lại, vui lòng nhập thông tin.</p>
        </div>

        <form>
            <div class="mb-3" data-aos="fade-up" data-aos-delay="400">
                <label for="email" class="form-label small text-muted">Email hoặc tên đăng nhập</label>
                <input type="text" class="form-control bg-white text-dark border-secondary border-opacity-25 py-2" id="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3" data-aos="fade-up" data-aos-delay="500">
                <label for="password" class="form-label small text-muted">Mật khẩu</label>
                <input type="password" class="form-control bg-white text-dark border-secondary border-opacity-25 py-2" id="password" placeholder="••••••••" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small" data-aos="fade-up" data-aos-delay="600">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input border-secondary" id="remember">
                    <label class="form-check-label text-muted" for="remember">Ghi nhớ tài khoản</label>
                </div>
                <a href="#" class="text-decoration-none text-primary">Quên mật khẩu?</a>
            </div>

            <div data-aos="flip-up" data-aos-delay="700">
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 mb-3 fw-medium">Đăng Nhập</button>
            </div>
        </form>

        <div class="text-center small text-muted mt-4" data-aos="fade-up" data-aos-delay="800">
            Bạn chưa có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng ký ngay</a>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
